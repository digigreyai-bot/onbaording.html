<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AgentAssist+ Onboarding{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aa: {
              navy: "#0B1F3A",
              ink: "#14233D",
              teal: "#1FB8B0",
              tealDeep: "#0F8F89",
              mist: "#F3F7FA",
              line: "#D7E2EA",
              muted: "#5B6B7C",
            },
          },
          fontFamily: {
            sans: ["Figtree", "Segoe UI", "sans-serif"],
          },
          boxShadow: {
            panel: "0 18px 50px rgba(11, 31, 58, 0.08)",
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: Figtree, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(31, 184, 176, 0.12), transparent 55%),
        radial-gradient(900px 420px at 100% 0%, rgba(11, 31, 58, 0.08), transparent 50%),
        linear-gradient(180deg, #f7fafc 0%, #eef3f7 100%);
      min-height: 100vh;
    }
    .aa-grid {
      background-image:
        linear-gradient(rgba(11, 31, 58, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(11, 31, 58, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .field-input {
      width: 100%;
      border: 1px solid #d7e2ea;
      border-radius: 0.75rem;
      padding: 0.7rem 0.9rem;
      background: #fff;
      color: #0b1f3a;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field-input:focus {
      outline: none;
      border-color: #1fb8b0;
      box-shadow: 0 0 0 3px rgba(31, 184, 176, 0.18);
    }
    .section-card {
      border: 1px solid #d7e2ea;
      border-radius: 1rem;
      background: #fff;
      padding: 1.25rem;
    }
    .save-pill {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .req {
      color: #0f8f89;
      font-weight: 700;
    }
    /* Contact-style phone: flag select + dial + number, no overlap */
    .phone-box {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      border-radius: 0.75rem;
      background: #f3f4f6;
      padding: 0.65rem 1rem;
      border: none;
      transition: box-shadow 0.15s ease;
    }
    .phone-box:focus-within {
      box-shadow: 0 0 0 2px #2dd4bf;
    }
    .phone-box .phone-country {
      appearance: none;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-weight: 600;
      color: #0b1f3a;
      padding: 0 0.15rem 0 0;
      max-width: 4.5rem;
      cursor: pointer;
    }
    .phone-box .phone-dial {
      flex: 0 0 auto;
      font-size: 1rem;
      font-weight: 500;
      color: #1f2937;
      min-width: 2.25rem;
    }
    .phone-box .phone-number {
      flex: 1 1 auto;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      font-size: 1rem;
      color: #1f2937;
      padding: 0;
    }
    .phone-box .phone-number::placeholder {
      color: #6b7280;
    }
    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }
    .choice-pill {
      border: 1px solid #d7e2ea;
      background: #fff;
      color: #0b1f3a;
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .choice-pill.is-active {
      background: #1fb8b0;
      border-color: #1fb8b0;
      color: #fff;
    }
    .btn-brand {
      background: #1fb8b0;
    }
    .btn-brand:hover {
      background: #0f8f89;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="aa-grid text-aa-ink flex flex-col min-h-screen">
  <div class="flex-1">
    {% block body %}{% endblock %}
  </div>
  {% block footer %}
  <footer class="mt-10 border-t border-aa-line bg-white/90">
    <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4 text-sm text-aa-muted">
      <div class="flex items-center gap-3">
        <img src="/static/logo-light-1.png" alt="AgentAssist+" class="h-8 w-auto" />
        <span>© <span id="aaYear"></span> AgentAssist+. All rights reserved.</span>
      </div>
      <div class="flex flex-wrap gap-4 font-semibold">
        <a href="https://agentassistplus.com" target="_blank" rel="noopener noreferrer" class="hover:text-aa-navy">Home</a>
        <a href="https://agentassistplus.com/contact" target="_blank" rel="noopener noreferrer" class="hover:text-aa-navy">Contact</a>
        <a href="https://agentassistplus.com/privacy-policy" target="_blank" rel="noopener noreferrer" class="hover:text-aa-navy">Privacy</a>
        <a href="https://dashboard.agentassistplus.com" target="_blank" rel="noopener noreferrer" class="hover:text-aa-navy">Dashboard</a>
      </div>
    </div>
  </footer>
  <script>document.getElementById("aaYear").textContent = String(new Date().getFullYear());</script>
  {% endblock %}
</body>
</html>
